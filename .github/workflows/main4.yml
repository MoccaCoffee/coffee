name: Americano

on:
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Run keepalive
        env:
          IRCLOUD_EMAIL: ${{ secrets.IRCLOUD_EMAIL4 }}
          IRCLOUD_PASSWORD: ${{ secrets.IRCLOUD_PASSWORD4 }}
          IRCLOUD_NETWORK: ${{ secrets.IRCLOUD_NETWORK4 }}
          FORCE_RUN: "true"
        run: node keepalive.mjs
